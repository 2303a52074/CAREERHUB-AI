<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Intelligence Panel — CareerHub AI</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 24px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 22px;
            border-radius: var(--radius-full);
            background: rgba(14, 25, 48, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #00d2ff;
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--gradient-primary);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.35);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .user-card, .interview-card {
            background: rgba(14, 25, 48, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 18px;
            padding: 22px;
            backdrop-filter: blur(12px);
            transition: var(--transition-smooth);
        }

        .user-card:hover, .interview-card:hover {
            border-color: rgba(56, 189, 248, 0.45);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.1);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .role-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 210, 255, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        .card-meta {
            font-size: 13px;
            color: #8da4c4;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .score-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #10b981;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="admin-layout">
        <div class="admin-header">
            <a href="index.html" class="brand-logo-container">
                <img src="assets/logo.png" alt="CareerHub AI" class="brand-logo-img">
                <div class="brand-logo-text">
                    <div class="brand-title">CareerHub <span>AI</span></div>
                    <div class="brand-subtitle">Admin Intelligence Portal</div>
                </div>
            </a>

            <div style="display: flex; gap: 12px;">
                <button class="btn btn-outline" onclick="location.href='dashboard.html'">
                    <i class="fas fa-columns"></i> Placement Cockpit
                </button>
                <button class="btn btn-outline" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div class="admin-nav-tabs">
            <button class="tab-btn active" id="btnUsers" onclick="switchTab('users')">
                <i class="fas fa-users"></i> Registered Candidates
            </button>
            <button class="tab-btn" id="btnInterviews" onclick="switchTab('interviews')">
                <i class="fas fa-headset"></i> Interview Sessions
            </button>
        </div>

        <div id="adminData">
            <div style="text-align: center; padding: 60px 0; color: #8da4c4;">
                <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: #00d2ff; margin-bottom: 16px;"></i>
                <p>Loading candidate placement data...</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            // acquire demo credentials if needed
            fetch('/api/auth/demo', { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    if (d.token) {
                        localStorage.setItem("token", d.token);
                        loadUsers();
                    } else {
                        window.location.href = "login.html";
                    }
                })
                .catch(() => { window.location.href = "login.html"; });
        } else {
            loadUsers();
        }

        function switchTab(tab) {
            document.getElementById('btnUsers').classList.toggle('active', tab === 'users');
            document.getElementById('btnInterviews').classList.toggle('active', tab === 'interviews');
            if (tab === 'users') loadUsers();
            else loadInterviews();
        }

        async function loadUsers() {
            const box = document.getElementById("adminData");
            box.innerHTML = '<div style="text-align: center; padding: 40px;"><i class="fas fa-spinner fa-spin" style="font-size: 28px; color: #00d2ff;"></i></div>';

            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem("token") }
                });

                if (!res.ok) {
                    const err = await res.json();
                    box.innerHTML = `<div class="card" style="border-color: #ef4444; color: #f87171;"><i class="fas fa-exclamation-circle"></i> Error loading candidates: ${err.message || 'Access restricted'}</div>`;
                    return;
                }

                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) {
                    box.innerHTML = '<div class="card" style="text-align: center; color: #8da4c4;">No candidate profiles found.</div>';
                    return;
                }

                let html = '<div class="data-grid">';
                data.forEach(user => {
                    html += `
                        <div class="user-card">
                            <div class="card-header-row">
                                <span class="card-title">${user.name || 'Candidate'}</span>
                                <span class="role-badge">${user.role || 'Student'}</span>
                            </div>
                            <div class="card-meta">
                                <div><i class="fas fa-envelope" style="width: 18px; color: #00d2ff;"></i> ${user.email}</div>
                                <div><i class="fas fa-calendar" style="width: 18px; color: #8da4c4;"></i> Joined: ${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'Active'}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                box.innerHTML = html;
            } catch (e) {
                box.innerHTML = `<div class="card" style="color: #f87171;">Network error fetching candidate profiles.</div>`;
            }
        }

        async function loadInterviews() {
            const box = document.getElementById("adminData");
            box.innerHTML = '<div style="text-align: center; padding: 40px;"><i class="fas fa-spinner fa-spin" style="font-size: 28px; color: #00d2ff;"></i></div>';

            try {
                const res = await fetch('/api/admin/interviews', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem("token") }
                });

                if (!res.ok) {
                    const err = await res.json();
                    box.innerHTML = `<div class="card" style="border-color: #ef4444; color: #f87171;"><i class="fas fa-exclamation-circle"></i> Error: ${err.message || 'Access restricted'}</div>`;
                    return;
                }

                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) {
                    box.innerHTML = '<div class="card" style="text-align: center; color: #8da4c4;">No mock interview sessions recorded yet.</div>';
                    return;
                }

                let html = '<div class="data-grid">';
                data.forEach(item => {
                    const userName = item.userId?.name || 'Candidate';
                    const userEmail = item.userId?.email || '';
                    html += `
                        <div class="interview-card">
                            <div class="card-header-row">
                                <span class="card-title">${userName}</span>
                                <span class="score-pill"><i class="fas fa-star"></i> Score: ${item.totalScore || 0}%</span>
                            </div>
                            <div class="card-meta">
                                <div><i class="fas fa-briefcase" style="width: 18px; color: #00d2ff;"></i> Role: ${item.role || 'General Tech'}</div>
                                <div><i class="fas fa-envelope" style="width: 18px; color: #8da4c4;"></i> ${userEmail}</div>
                                <div><i class="fas fa-clock" style="width: 18px; color: #8da4c4;"></i> ${new Date(item.date).toLocaleString()}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                box.innerHTML = html;
            } catch (e) {
                box.innerHTML = `<div class="card" style="color: #f87171;">Network error fetching interviews.</div>`;
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
