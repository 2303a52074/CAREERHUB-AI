<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerHub AI — AI Job Matching</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/shared-nav.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(14, 25, 48, 0.6);
      padding: 0.35rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .filter-tab {
      padding: 0.45rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-tab.active {
      background: rgba(0, 210, 255, 0.15);
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }
    .opportunities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }
    .opp-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition-smooth);
    }
    .opp-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
    }
    .opp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .opp-match-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 800;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: #00d2ff;
    }
    .pill-tag {
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-full);
      display: inline-block;
      margin-right: 0.35rem;
      margin-bottom: 0.35rem;
    }
    .pill-match { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .pill-miss { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    @media (max-width: 900px) {
      .opportunities-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page-title="AI Job Matching" data-page-subtitle="Tailored Placement & Internship Opportunities Ranked by Profile Fit">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="header-container"></div>
      <main class="page-container">
        
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-tabs">
            <div class="filter-tab active" data-type="all">All Opportunities</div>
            <div class="filter-tab" data-type="job">Jobs</div>
            <div class="filter-tab" data-type="internship">Internships</div>
            <div class="filter-tab" data-type="hackathon">Hackathons</div>
          </div>

          <div style="min-width:280px;">
            <input type="text" id="oppSearch" class="input-skill" placeholder="Search by company, role, or skill..." style="width:100%;">
          </div>
        </div>

        <!-- Opportunities Grid -->
        <div class="opportunities-grid" id="oppGrid">
          <div style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--text-muted);">
            Loading personalized job matches...
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/assets/shared-nav.js"></script>
  <script>
    let allOpportunities = [];
    let currentFilter = 'all';

    const token = localStorage.getItem('token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    async function loadOpportunities() {
      try {
        const res = await fetch('/api/career/opportunities', { headers });
        if (res.ok) {
          const data = await res.json();
          allOpportunities = data.opportunities || [];
          renderGrid();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderGrid() {
      const q = document.getElementById('oppSearch').value.toLowerCase().trim();
      let list = allOpportunities;

      if (currentFilter !== 'all') {
        list = list.filter(o => (o.type || '').toLowerCase() === currentFilter);
      }

      if (q) {
        list = list.filter(o => 
          (o.title || '').toLowerCase().includes(q) ||
          (o.organization || '').toLowerCase().includes(q) ||
          (o.requiredSkills || []).some(s => s.toLowerCase().includes(q))
        );
      }

      const grid = document.getElementById('oppGrid');
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--text-muted);">No matching opportunities found.</div>';
        return;
      }

      grid.innerHTML = list.map(opp => `
        <div class="opp-card">
          <div>
            <div class="opp-header">
              <div>
                <span style="font-size:0.75rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;">${opp.organization}</span>
                <h3 style="font-size:1.15rem;font-weight:700;color:#fff;margin-top:0.2rem;">${opp.title}</h3>
              </div>
              <div class="opp-match-pill">
                <span>🎯</span> <span>${opp.overallMatch || 85}% Match</span>
              </div>
            </div>

            <div style="display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;">
              <span class="role-tag-pill" style="font-size:0.72rem;">📍 ${opp.location || 'Remote'}</span>
              <span class="role-tag-pill" style="font-size:0.72rem;color:#34d399;border-color:rgba(16,185,129,0.3);">💰 ${opp.salaryOrStipend || 'Competitive'}</span>
              <span class="role-tag-pill" style="font-size:0.72rem;text-transform:capitalize;">🏷️ ${opp.type || 'Job'}</span>
            </div>

            <p style="font-size:0.82rem;color:var(--text-secondary);line-height:1.5;margin-bottom:1.25rem;">
              ${opp.description}
            </p>

            <!-- Skills -->
            <div style="margin-bottom:1.25rem;">
              <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);margin-bottom:0.35rem;text-transform:uppercase;">Skills Match</div>
              <div>
                ${(opp.matchedSkills || []).map(s => `<span class="pill-tag pill-match">${s}</span>`).join('')}
                ${(opp.missingSkills || []).map(s => `<span class="pill-tag pill-miss">${s}</span>`).join('')}
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div style="display:flex;gap:0.75rem;padding-top:1rem;border-top:1px solid var(--border-subtle);">
            <a href="${opp.applicationLink || '#'}" target="_blank" class="btn-action btn-next" style="flex:1;text-align:center;text-decoration:none;font-size:0.85rem;padding:0.65rem;">
              Apply Official ↗
            </a>
            <button onclick="trackApplication('${opp.organization}', '${opp.title}', ${opp.overallMatch || 85})" class="btn-action btn-prev" style="font-size:0.85rem;padding:0.65rem;">
              + Track in Pipeline
            </button>
          </div>
        </div>
      `).join('');
    }

    // Track Application
    window.trackApplication = async function (company, role, match) {
      try {
        window.showToast(`Tracking ${role} at ${company}...`, 'info');
        const res = await fetch('/api/career/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({
            company,
            jobRole: role,
            status: 'Applied',
            matchPercentage: match,
            notes: 'Applied through CareerHub AI Job Matching portal'
          })
        });

        if (res.ok) {
          window.showToast('Application tracked in pipeline!', 'success');
        } else {
          window.showToast('Failed to track application.', 'error');
        }
      } catch (e) {
        console.error(e);
        window.showToast('Error tracking application.', 'error');
      }
    };

    // Filter clicks
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.type;
        renderGrid();
      });
    });

    document.getElementById('oppSearch').addEventListener('input', renderGrid);
    document.addEventListener('DOMContentLoaded', loadOpportunities);
  </script>
</body>
</html>
