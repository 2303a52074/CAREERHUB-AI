<!--Design a responsive login page with validation and backend API integration for a modern website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CareerHub AI Placement Platform</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #0f1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 40%, rgba(0, 210, 255, 0.08), transparent);
            pointer-events: none;
        }
        
        .login-container {
            background: rgba(13, 27, 42, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px;
            width: 450px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 18, 31, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
        }
        
        .register-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        
        .register-link a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid #ff4757;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff4757;
            font-size: 13px;
            text-align: center;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 500px) {
            .login-container { width: 90%; padding: 32px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="login-container">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; display: inline-block;">
                <img src="assets/logo.png" alt="CareerHub AI" style="width: 72px; height: 72px; border-radius: 20px; object-fit: cover; box-shadow: 0 0 25px rgba(0, 210, 255, 0.45); border: 1px solid rgba(56, 189, 248, 0.35); margin-bottom: 12px;">
            </a>
            <h1>CareerHub AI</h1>
            <p>Placement & Career Intelligence</p>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <button type="button" class="btn-login" style="background: linear-gradient(135deg, #ffa116, #ea580c); margin: 0; padding: 12px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 15px rgba(254, 161, 22, 0.3);" onclick="leetCodeLogin()">
                <i class="fas fa-code"></i> Login with LeetCode
            </button>
            <button type="button" class="btn-login" style="background: linear-gradient(135deg, #10b981, #059669); margin: 0; padding: 12px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);" onclick="quickDemoLogin()">
                <i class="fas fa-bolt"></i> Instant Demo
            </button>
        </div>

        <div style="display: flex; align-items: center; margin: 15px 0; color: rgba(255,255,255,0.4); font-size: 12px;">
            <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
            <span style="padding: 0 10px;">or sign in with email</span>
            <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
        </div>
        
        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" value="demo@example.com" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" value="password123" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="register.html">Create Account</a>
        </div>
    </div>
    
    <script>
        const BASE_URL = window.location.origin;

        async function leetCodeLogin() {
            const username = prompt("Enter your official LeetCode handle (e.g. neal_wu or your username):");
            if (!username || !username.trim()) return;

            const cleanUser = username.trim();
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Syncing LeetCode...';
            }

            try {
                // Fetch LeetCode stats
                const lcRes = await fetch(`${BASE_URL}/api/user/leetcode/${encodeURIComponent(cleanUser)}`);
                const lcData = await lcRes.json();

                // Authenticate demo candidate session
                const authRes = await fetch(`${BASE_URL}/api/auth/demo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const authData = await authRes.json();

                if (authData.token) {
                    localStorage.setItem('token', authData.token);
                    localStorage.setItem('userName', cleanUser);
                    localStorage.setItem('leetcodeUsername', cleanUser);
                    if (lcData.success) {
                        localStorage.setItem('leetcodeStats', JSON.stringify(lcData));
                    }
                    window.location.href = 'dashboard.html?section=coding&synced=true';
                } else {
                    quickDemoLogin();
                }
            } catch (e) {
                quickDemoLogin();
            }
        }

        async function quickDemoLogin() {
            try {
                const response = await fetch(`${BASE_URL}/api/auth/demo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    if (data.user) {
                        localStorage.setItem('userName', data.user.name);
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    login();
                }
            } catch (e) {
                login();
            }
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    
                    // Store user info
                    if (data.user) {
                        localStorage.setItem('userName', data.user.name);
                    }
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check if server is running.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
