<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerHub AI — Career Assistant</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/shared-nav.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .assistant-wrapper {
      max-width: 950px;
      margin: 0 auto;
      height: min(780px, calc(100vh - var(--header-height) - 3rem));
      min-height: 440px;
      display: flex;
      flex-direction: column;
      background: #0d1727;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .chat-header-bar {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101c2d;
    }
    .prompts-bar {
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.012);
    }
    .quick-prompt-btn {
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .quick-prompt-btn:hover {
      border-color: #00d2ff;
      color: #fff;
      background: rgba(0, 210, 255, 0.08);
    }
    .messages-area {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 0;
    }
    .message-bubble {
      display: flex;
      gap: 1rem;
      max-width: min(82%, 700px);
    }
    .message-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-ai {
      align-self: flex-start;
    }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.95rem;
    }
    .msg-user-avatar { background: #3b82f6; color: #fff; }
    .msg-ai-avatar { background: linear-gradient(135deg, #00d2ff, #6366f1); color: #fff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
    .msg-content {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .message-user .msg-content {
      background: rgba(42, 104, 190, 0.2);
      border: 1px solid rgba(82, 139, 218, 0.28);
      color: #fff;
    }
    .message-ai .msg-content {
      background: #132137;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .chat-input-bar {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 0.75rem;
      background: #101c2d;
    }
    .chat-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: #0b1422;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      width: auto;
      min-width: 0;
    }
    .chat-input:focus {
      border-color: var(--text-accent);
    }
    .chat-send-button {
      flex: 0 0 auto;
      min-height: 44px;
    }
    .provider-status {
      margin-top: 0.25rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    @media (max-width: 820px) {
      .assistant-wrapper {
        height: calc(100dvh - var(--header-height) - 2rem);
      }
      .prompts-bar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow: visible;
      }
      .quick-prompt-btn {
        min-height: 44px;
        white-space: normal;
      }
    }
    @media (max-width: 560px) {
      .assistant-wrapper {
        min-height: 380px;
        border-radius: 10px;
      }
      .chat-header-bar {
        padding: 0.8rem;
        gap: 0.5rem;
      }
      .prompts-bar {
        padding: 0.65rem 0.8rem;
      }
      .messages-area {
        padding: 0.85rem;
      }
      .message-bubble {
        max-width: 96%;
        gap: 0.55rem;
      }
      .msg-avatar {
        width: 30px;
        height: 30px;
        font-size: 0.8rem;
      }
      .msg-content {
        padding: 0.7rem 0.8rem;
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .chat-input-bar {
        padding: 0.7rem;
        gap: 0.5rem;
      }
      .chat-input {
        font-size: 16px;
      }
      .chat-send-button {
        padding: 0.75rem 0.9rem !important;
      }
    }
  </style>
</head>
<body data-page-title="Career Assistant" data-page-subtitle="AI Guidance on Technical Placements, Resume Tailoring & System Design">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="header-container"></div>
      <main class="page-container">
        
        <div class="assistant-wrapper">
          <!-- Header -->
          <div class="chat-header-bar">
            <div>
              <div style="font-weight:700;color:#fff;font-size:1rem;display:flex;align-items:center;gap:0.5rem;">
                <span>🤖</span> CareerHub AI Placement Copilot
              </div>
              <div id="providerStatus" class="provider-status" role="status" aria-live="polite">Checking AI availability…</div>
              <div style="font-size:0.72rem;color:var(--text-muted);margin-top:0.3rem;">Your message and limited profile context are sent to the configured AI service. Conversation history is saved to your account.</div>
            </div>
            <button id="btnClearChat" class="role-tag-pill" style="font-size:0.72rem;padding:0.25rem 0.65rem;">
              Clear History
            </button>
          </div>

          <!-- Quick Starter Prompts -->
          <div class="prompts-bar">
            <button class="quick-prompt-btn" onclick="sendPrompt('How should I structure my resume for my target role?')">
              📄 Resume Structuring
            </button>
            <button class="quick-prompt-btn" onclick="sendPrompt('What are the most commonly asked System Design questions in top tech interviews?')">
              🏗️ System Design Questions
            </button>
            <button class="quick-prompt-btn" onclick="sendPrompt('Give me a 30-day preparation strategy for LeetCode medium problems.')">
              💻 30-Day LeetCode Plan
            </button>
            <button class="quick-prompt-btn" onclick="sendPrompt('How do I answer \'Tell me about yourself\' using the STAR framework?')">
              🎙️ Behavioral STAR Answers
            </button>
          </div>

          <!-- Messages Area -->
          <div class="messages-area" id="messagesArea" role="log" aria-live="polite" aria-relevant="additions text">
            <div class="message-bubble message-ai">
              <div class="msg-avatar msg-ai-avatar">🤖</div>
              <div class="msg-content">
                Checking provider availability and privacy requirements…
              </div>
            </div>
          </div>

          <!-- Chat Input -->
          <div class="chat-input-bar">
            <input type="text" id="chatInput" class="chat-input" placeholder="Ask about interviews, system design, coding problems, or resume tips..." autocomplete="off" aria-label="Message CareerHub AI Copilot">
            <button id="btnSend" class="btn-action btn-next chat-send-button" style="padding:0.85rem 1.5rem;font-size:0.9rem;">
              Send →
            </button>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/assets/shared-nav.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    const messagesArea = document.getElementById('messagesArea');
    const chatInput = document.getElementById('chatInput');
    const sendButton = document.getElementById('btnSend');
    const providerStatus = document.getElementById('providerStatus');
    let quotaRetryAt = 0;
    let quotaCountdownTimer = null;
    let requestInProgress = false;
    let assistantProviderReady = false;
    let assistantMode = 'unavailable';
    let assistantPrimaryModel = 'DeepSeek';
    let assistantFallbackConfigured = false;

    function updateSendAvailability() {
      sendButton.disabled = requestInProgress || !assistantProviderReady || quotaRetryAt > Date.now();
      messagesArea?.querySelectorAll('[data-retry-message]').forEach(button => {
        button.disabled = requestInProgress || quotaRetryAt > Date.now();
      });
    }

    function applyQuotaCooldown(retryAfter) {
      const expiresAt = Date.parse(retryAfter || '');
      if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
        quotaRetryAt = 0;
        if (quotaCountdownTimer) clearInterval(quotaCountdownTimer);
        quotaCountdownTimer = null;
        updateSendAvailability();
        return;
      }

      quotaRetryAt = expiresAt;
      if (quotaCountdownTimer) clearInterval(quotaCountdownTimer);
      const updateCountdown = () => {
        const secondsRemaining = Math.max(0, Math.ceil((quotaRetryAt - Date.now()) / 1000));
        if (!secondsRemaining) {
          quotaRetryAt = 0;
          clearInterval(quotaCountdownTimer);
          quotaCountdownTimer = null;
          providerStatus.textContent = 'The pause has ended. Availability will be checked with your next message.';
          updateSendAvailability();
          return;
        }
        const minutes = Math.ceil(secondsRemaining / 60);
        providerStatus.textContent = `Provider reports no available credits. Sending is paused for about ${minutes} minute${minutes === 1 ? '' : 's'}.`;
        providerStatus.style.color = '#fbbf24';
        updateSendAvailability();
      };
      updateCountdown();
      quotaCountdownTimer = setInterval(updateCountdown, 1000);
    }

    function appendMessage(role, text, source = '') {
      const isUser = role === 'user';
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-user' : 'message-ai'}`;
      const avatar = document.createElement('div');
      avatar.className = `msg-avatar ${isUser ? 'msg-user-avatar' : 'msg-ai-avatar'}`;
      avatar.textContent = isUser ? '👤' : '🤖';
      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = formatText(text);
      if (source) {
        const sourceLine = document.createElement('div');
        sourceLine.style.cssText = 'font-size:0.68rem;color:var(--text-muted);margin-top:0.5rem;';
        sourceLine.textContent = source;
        content.appendChild(sourceLine);
      }
      bubble.append(avatar, content);

      messagesArea.appendChild(bubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return bubble;
    }

    function appendRetryableError(text, message) {
      const bubble = appendMessage('assistant', text);
      const retryButton = document.createElement('button');
      retryButton.type = 'button';
      retryButton.className = 'role-tag-pill';
      retryButton.dataset.retryMessage = 'true';
      retryButton.textContent = 'Retry response';
      retryButton.addEventListener('click', () => {
        bubble.remove();
        handleSendMessage(message, true);
      });
      bubble.querySelector('.msg-content').appendChild(retryButton);
      updateSendAvailability();
    }

    function formatText(text) {
      return window.renderCareerAssistantMarkdown(text);
    }

    async function handleSendMessage(msgText, isRetry = false) {
      if (!assistantProviderReady) {
        providerStatus.textContent = 'Career Assistant is disconnected. Connect an approved paid/data-processing AI provider to enable personalized chat.';
        return;
      }
      const message = (msgText || chatInput.value).trim();
      if (!message || requestInProgress || quotaRetryAt > Date.now()) return;
      if (!token) {
        appendMessage('assistant', 'Sign in to use the account-connected AI Copilot.');
        return;
      }

      let userBubble = null;
      if (!isRetry) {
        userBubble = appendMessage('user', message);
        chatInput.value = '';
      }
      const typingBubble = document.createElement('div');
      typingBubble.className = 'message-bubble message-ai';
      typingBubble.id = 'typingIndicator';
      typingBubble.innerHTML = `
        <div class="msg-avatar msg-ai-avatar">🤖</div>
        <div class="msg-content" style="color:var(--text-muted);">
          Generating with ${assistantPrimaryModel}${assistantFallbackConfigured ? '… A backup model may be used if needed.' : '…'}
        </div>
      `;
      messagesArea.appendChild(typingBubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      requestInProgress = true;
      updateSendAvailability();
      chatInput.disabled = true;

      try {
        const res = await fetch('/api/career/assistant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ message }),
          signal: AbortSignal.timeout(40000)
        });
        const data = await res.json().catch(() => ({}));
        typingBubble.remove();
        if (!res.ok) {
          if (res.status === 401) {
            appendMessage('assistant', 'Your sign-in has expired. Sign in again to continue.');
            window.showToast('Authentication required. Please sign in again.', 'error');
          } else {
            if (data.code === 'AI_PERSONAL_CONTEXT_NOT_SUPPORTED') {
              userBubble?.remove();
              chatInput.value = message;
              providerStatus.textContent = data.message ||
                'Free AI mode accepts general career questions only and does not receive profile or prior chat context.';
              return;
            }
            if (data.code === 'AI_PROVIDER_NOT_CONFIGURED') {
              providerStatus.textContent = 'Career Assistant is disconnected. Connect an approved paid/data-processing AI provider to enable personalized chat.';
              return;
            }
            if (data.code === 'AI_PROVIDER_QUOTA_EXCEEDED') applyQuotaCooldown(data.retryAfter);
            else providerStatus.textContent = data.fallbackAttempted
              ? 'Both configured models could not generate a usable response.'
              : 'Assistant temporarily unavailable.';
            const safeMessage = typeof data.message === 'string' && data.message.trim()
              ? data.message
              : 'Career Assistant is temporarily unavailable. Please try again.';
            appendRetryableError(safeMessage, message);
            window.showToast(safeMessage, 'error');
          }
          return;
        }
        if (typeof data.reply !== 'string' || !data.reply.trim()) {
          document.getElementById('providerStatus').textContent = 'Assistant temporarily unavailable.';
          appendRetryableError('The AI service returned no usable text. Retry the request.', message);
          return;
        }
        const modelLabel = typeof data.model === 'string' ? data.model : 'OpenRouter';
        const resultLabel = data.contextMode === 'local_profile'
          ? 'Answered locally from your saved profile; nothing was sent to Gemini.'
          : data.fallbackUsed
          ? `Response generated successfully with backup model ${modelLabel}.`
          : `Response generated successfully with ${modelLabel}.`;
        appendMessage('assistant', data.reply, resultLabel);
        providerStatus.textContent = data.contextMode === 'local_profile'
          ? 'Answered locally from your saved profile.'
          : data.fallbackUsed
          ? 'Primary model was unavailable; the backup generated this response.'
          : 'Ready to help';
      } catch (err) {
        typingBubble.remove();
        const messageText = err.name === 'TimeoutError'
          ? 'Career Assistant is taking longer than expected. Please try again.'
          : 'Career Assistant is temporarily unavailable. Please try again.';
        appendRetryableError(messageText, message);
        providerStatus.textContent = 'Assistant temporarily unavailable.';
        window.showToast(messageText, 'error');
      } finally {
        requestInProgress = false;
        updateSendAvailability();
        chatInput.disabled = false;
        messagesArea.querySelectorAll('[data-retry-message]').forEach(button => {
          button.disabled = quotaRetryAt > Date.now();
        });
        chatInput.focus();
      }
    }

    window.sendPrompt = function (promptText) {
      handleSendMessage(promptText);
    };

    document.getElementById('btnSend').addEventListener('click', () => handleSendMessage());

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    document.getElementById('btnClearChat').addEventListener('click', async () => {
      const button = document.getElementById('btnClearChat');
      if (!token) {
        window.showToast('Sign in to clear saved conversation history.', 'error');
        return;
      }
      button.disabled = true;
      try {
        const res = await fetch('/api/career/assistant/history', { method: 'DELETE', headers });
        if (!res.ok) throw new Error('clear failed');
        messagesArea.replaceChildren();
        appendMessage('assistant', 'Conversation history cleared for this account. What would you like help with?');
      } catch {
        window.showToast('Could not clear conversation history. Please try again.', 'error');
      } finally {
        button.disabled = false;
      }
    });

    async function loadConversation() {
      const status = providerStatus;
      if (!token) {
        status.textContent = 'Sign in to use the account-connected AI Copilot.';
        return;
      }
      try {
        const [providerResponse, historyResponse] = await Promise.all([
          fetch('/api/career/assistant/status', { headers }),
          fetch('/api/career/assistant/history', { headers })
        ]);
        if (providerResponse.status === 401 || historyResponse.status === 401) {
          status.textContent = 'Your sign-in is invalid. Sign in again to use Copilot.';
          return;
        }
        if (providerResponse.ok) {
          const provider = await providerResponse.json();
          assistantMode = provider.assistantMode || 'unavailable';
          assistantProviderReady = provider.configured === true &&
            provider.quotaBlocked !== true;
          assistantPrimaryModel = provider.model || 'DeepSeek';
          assistantFallbackConfigured = Boolean(provider.fallbackConfigured);
          if (provider.quotaBlocked) {
            applyQuotaCooldown(provider.retryAfter);
          } else if (provider.assistantMode === 'general_privacy_safe') {
            providerStatus.textContent = `General career AI is ready with ${assistantPrimaryModel}. Your profile and saved chat history are not sent; don't include personal, identifying, confidential, resume, or code details.`;
            providerStatus.style.color = 'var(--text-cyan)';
            updateSendAvailability();
          } else {
            const geminiConfigurationMessages = {
              missing_api_key: 'Gemini is selected, but GEMINI_API_KEY is missing from backend configuration.',
              missing_model: 'Gemini is selected, but GEMINI_MODEL is missing from backend configuration.',
              unsupported_feature: 'Gemini does not support this assistant workflow.',
              privacy_restricted: 'Copilot has not sent your message. Gemini is not approved for personal conversation, profile, or history data; configure an approved paid/data-processing provider.',
              feature_not_enabled: 'Gemini general Career Assistant is not enabled in GEMINI_PRIMARY_FEATURES.'
            };
            status.textContent = provider.configured
              ? `Generating with ${assistantPrimaryModel} when you send a message.` +
                (assistantFallbackConfigured ? ' A configured backup is available if the primary fails.' : '')
              : provider.provider === 'Gemini' && geminiConfigurationMessages[provider.geminiConfigurationIssue]
                ? geminiConfigurationMessages[provider.geminiConfigurationIssue]
                : provider.dataProcessingApproval?.approved !== true
                  ? 'Copilot is not connected. Personal messages, profile context, and conversation history require an explicitly approved paid/data-processing provider. Configure a paid OpenRouter or Groq provider and verify its data terms before enabling it.'
                  : 'AI assistant is not configured. Check the backend provider settings.';
            status.style.color = provider.configured ? 'var(--text-cyan)' : '#fbbf24';
            updateSendAvailability();
          }
        } else {
          assistantProviderReady = false;
          updateSendAvailability();
        }
        if (historyResponse.ok) {
          const history = await historyResponse.json();
          messagesArea.replaceChildren();
          if (!history.messages.length) {
            if (assistantProviderReady) {
              appendMessage('assistant', assistantMode === 'general_privacy_safe'
                ? 'Ask general career questions for a Gemini response. Personal profile questions are answered locally from your saved profile; your profile and chat history are never sent to free Gemini.'
                : 'Your account conversation history is private to this account and is sent only to the approved provider shown above.');
            }
          } else {
            history.messages.forEach(message => appendMessage(message.role === 'user' ? 'user' : 'assistant', message.content));
          }
        }
      } catch {
        status.textContent = 'Assistant availability could not be checked.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadConversation);
  </script>
</body>
</html>
