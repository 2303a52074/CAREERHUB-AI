<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerHub AI — Career Roadmap</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/shared-nav.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .roadmap-header-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .overall-progress-box {
      min-width: 260px;
    }
    .phases-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .phase-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      transition: var(--transition-smooth);
    }
    .phase-card:hover {
      border-color: var(--border-hover);
    }
    .phase-card.phase-completed {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.03);
    }
    .phase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .phase-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }
    .phase-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    .milestones-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .milestone-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: var(--transition-smooth);
    }
    .milestone-item:hover {
      background: rgba(56, 189, 248, 0.06);
    }
    .milestone-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      padding: 0;
      background: transparent;
      font: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .milestone-item.completed .milestone-checkbox {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
    }
    .milestone-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      flex: 1;
    }
    .milestone-item.completed .milestone-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .phase-status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-in-progress { background: rgba(0, 210, 255, 0.15); color: #38bdf8; }
    .status-pending { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
  </style>
</head>
<body data-page-title="Career Roadmap" data-page-subtitle="Phased Preparation Milestones & Engineering Placement Pathway">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="header-container"></div>
      <main class="page-container">
        
        <!-- Header Banner & Progress Bar -->
        <div class="roadmap-header-card">
          <div>
            <span style="font-size:0.75rem;font-weight:700;color:var(--text-accent);text-transform:uppercase;">Profile-Based Career Pathway</span>
            <h2 style="font-size:1.6rem;font-weight:800;color:#fff;margin:0.25rem 0 0.5rem;" id="roadmapRoleTitle">
              Career Pathway
            </h2>
            <p style="font-size:0.85rem;color:var(--text-muted);">
              Follow locally generated milestones based on your saved profile and progress. Your completions stay saved.
            </p>
          </div>

          <div class="overall-progress-box">
            <button type="button" class="btn-action btn-next" id="regenerateRoadmapButton"
              style="margin-bottom:.8rem;padding:.45rem .8rem;font-size:.8rem;">Regenerate roadmap</button>
            <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem;">
              <span style="font-size:0.82rem;font-weight:600;color:#fff;">Overall Progress</span>
              <span style="font-size:0.82rem;font-weight:700;color:var(--text-accent);" id="roadmapPercentText">--%</span>
            </div>
            <div style="height:10px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden;">
              <div id="roadmapProgressBar" style="width:0%;height:100%;background:var(--gradient-primary);transition:width 0.6s ease;"></div>
            </div>
            <p id="roadmapSourceStatus" style="font-size:0.72rem;color:var(--text-muted);margin-top:0.7rem;"></p>
          </div>
        </div>

        <!-- 5 Phased Milestone Sections -->
        <div class="phases-container" id="phasesContainer">
          <div role="status" style="padding:2rem;text-align:center;color:var(--text-muted);">Loading your saved career roadmap…</div>
        </div>

      </main>
    </div>
  </div>

  <script src="/assets/shared-nav.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
    const roadmapContainer = document.getElementById('phasesContainer');
    const regenerateButton = document.getElementById('regenerateRoadmapButton');
    const pendingMilestoneUpdates = new Set();

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);

    async function loadRoadmap() {
      roadmapContainer.innerHTML =
        '<div role="status" style="padding:2rem;text-align:center;color:var(--text-muted);">Loading your saved career roadmap…</div>';
      try {
        const res = await fetch('/api/career/roadmap', {
          headers,
          signal: AbortSignal.timeout(15000)
        });
        if (res.ok) {
          const roadmap = await res.json();
          renderRoadmap(roadmap);
        } else {
          const error = await res.json().catch(() => ({}));
          const message = escapeHtml(error.message || 'Unable to load roadmap.');
          const action = error.actionUrl === '/profile'
            ? ' <a href="/profile">Choose a target role</a>.'
            : '';
          roadmapContainer.innerHTML =
            `<div role="alert" style="padding:2rem;text-align:center;color:var(--text-muted);">${message}${action} Save a target role in your profile, then reload this page.</div>`;
        }
      } catch (e) {
        console.error('Roadmap fetch error:', e);
        roadmapContainer.innerHTML =
          '<div role="alert" style="padding:2rem;text-align:center;color:var(--text-muted);">Could not load your career roadmap. Check your connection, then retry with “Regenerate roadmap”.</div>';
      } finally {
        regenerateButton.disabled = false;
        regenerateButton.textContent = 'Regenerate roadmap';
      }
    }

    function renderRoadmap(data) {
      document.getElementById('roadmapRoleTitle').innerText = `${data.targetRole || 'Career'} Pathway`;
      const progress = data.progressPercentage || 0;
      document.getElementById('roadmapPercentText').innerText = `${progress}% Complete`;
      document.getElementById('roadmapProgressBar').style.width = `${progress}%`;
      document.getElementById('roadmapSourceStatus').textContent = ['openrouter', 'gemini', 'groq'].includes(data.generationSource)
        ? 'AI-personalized roadmap. Progress is based on saved milestone completion.'
        : 'Generated locally from any saved target role, skills, assessment, and skill-gap data. Starter milestones fill gaps when profile evidence is missing; progress is saved to your account.';

      const phases = data.phases || [];
      const container = roadmapContainer;

      container.innerHTML = phases.map(phase => {
        const isAllDone = phase.status === 'completed';
        const statusClass = `status-${(phase.status || 'pending').toLowerCase().replace(' ', '-')}`;
        return `
          <div class="phase-card ${isAllDone ? 'phase-completed' : ''}">
            <div class="phase-header">
              <h3 class="phase-title">${escapeHtml(phase.title)}</h3>
              <span class="phase-status-badge ${statusClass}">${phase.status || 'Pending'}</span>
            </div>
            <p class="phase-desc">${escapeHtml(phase.description)}</p>

            <div class="milestones-list">
              ${(phase.milestones || []).map(m => `
                <div class="milestone-item ${m.completed ? 'completed' : ''}">
                  <button type="button" class="milestone-checkbox"
                    data-milestone-id="${escapeHtml(m.id)}" data-completed="${!m.completed}"
                    aria-pressed="${Boolean(m.completed)}"
                    aria-label="${m.completed ? 'Mark milestone incomplete' : 'Mark milestone complete'}">
                    ${m.completed ? '✓' : ''}
                  </button>
                  <span class="milestone-text">${escapeHtml(m.title)}${m.completionCriteria ? `<small style="display:block;color:var(--text-muted);margin-top:0.2rem;">Done when: ${escapeHtml(m.completionCriteria)}</small>` : ''}</span>
                  <span style="font-size:0.7rem;color:var(--text-accent);font-weight:600;">${Number.isFinite(m.estimatedHours) ? `${m.estimatedHours}h` : 'Progress'}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
      container.querySelectorAll('.milestone-checkbox').forEach(button => {
        button.addEventListener('click', () =>
          window.toggleMilestone(button.dataset.milestoneId, button.dataset.completed === 'true'));
      });
    }

    window.toggleMilestone = async function (milestoneId, completed) {
      if (pendingMilestoneUpdates.size > 0) return;
      pendingMilestoneUpdates.add(milestoneId);
      roadmapContainer.querySelectorAll('.milestone-checkbox').forEach(control => { control.disabled = true; });
      try {
        window.showToast('Updating milestone status...', 'info');
        const res = await fetch('/api/career/roadmap/milestone', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ milestoneId, completed }),
          signal: AbortSignal.timeout(15000)
        });

        if (res.ok) {
          const data = await res.json();
          window.showToast(completed ? 'Milestone completed' : 'Milestone marked incomplete', 'success');
          renderRoadmap(data.roadmap);
        } else {
          window.showToast('Failed to update milestone', 'error');
        }
      } catch (e) {
        window.showToast(
          e.name === 'TimeoutError'
            ? 'Milestone update timed out. Please retry.'
            : 'Network error updating milestone',
          'error'
        );
      } finally {
        pendingMilestoneUpdates.delete(milestoneId);
        roadmapContainer.querySelectorAll('.milestone-checkbox').forEach(control => { control.disabled = false; });
      }
    };

    regenerateButton.addEventListener('click', async () => {
      if (regenerateButton.disabled) return;
      regenerateButton.disabled = true;
      regenerateButton.textContent = 'Regenerating…';
      roadmapContainer.innerHTML =
        '<div role="status" style="padding:2rem;text-align:center;color:var(--text-muted);">Generating a new roadmap. Your saved progress remains intact.</div>';
      try {
        const res = await fetch('/api/career/roadmap/regenerate', {
          method: 'POST',
          headers,
          signal: AbortSignal.timeout(15000)
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(result.message || 'Roadmap regeneration failed.');
        renderRoadmap(result.roadmap);
        window.showToast('Roadmap regenerated. Completed milestones were preserved.', 'success');
      } catch (error) {
        roadmapContainer.innerHTML =
          `<div role="alert" style="padding:2rem;text-align:center;color:var(--text-muted);">${escapeHtml(error.message)} Your current roadmap remains saved. You can retry when ready.</div>`;
      } finally {
        regenerateButton.disabled = false;
        regenerateButton.textContent = 'Regenerate roadmap';
      }
    });

    document.addEventListener('DOMContentLoaded', loadRoadmap);
  </script>
</body>
</html>
